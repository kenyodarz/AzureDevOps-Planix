server:
  port: 8081
agent:
  url: "${AGENT_URL:http://localhost:8082}"
  timeout: "${AGENT_TIMEOUT:120s}"
# Auditoría del backlog (Fase 05, B-02).
#   batch-size:  historias por lote. El 10 no responde a ningún límite técnico conocido: era un
#                número escrito a mano. Se deja configurable para poder ajustarlo con datos.
#   concurrency: lotes auditados a la vez. Antes no había tope y un sprint grande podía lanzar
#                diez llamadas simultáneas al agente, cada una con el timeout de arriba.
audit:
  batch-size: "${AUDIT_BATCH_SIZE:10}"
  concurrency: "${AUDIT_CONCURRENCY:2}"
# Tablero de calidad (Fase 06, B-07; revisado en Fase 08, B-11).
#   mock-fallback.enabled: si un fallo del agente debe sustituirse por el tablero simulado. Es la
#                          ruta local de la POC y NO debe encenderse en producción: un tablero de
#                          mentira es indistinguible de uno real para quien lo mira.
#                          Hasta la Fase 07 esta bandera no se declaraba y se deducía de
#                          spring.ai.mcp.client.enabled. Al eliminarse el módulo mcp-client (D-32)
#                          esa deducción se quedó sin sujeto, así que la propiedad pasa a ser
#                          explícita. El valor efectivo en local es el mismo de antes: true.
#                          En producción, apagar con DASHBOARD_MOCK_FALLBACK_ENABLED=false.
dashboard:
  mock-fallback:
    enabled: "${DASHBOARD_MOCK_FALLBACK_ENABLED:false}"
# Destino de los reportes Markdown del tablero (Fase 06, DP-04 resuelta como «solo disco detrás de
# un puerto»). Cambiar de disco a S3 es escribir otro adaptador de ReportStoragePort: el dominio no
# se entera. Ojo en despliegues con varias réplicas o sistema de ficheros efímero: los reportes se
# pierden al reiniciar (deuda D-41).
report:
  storage:
    directory: "${REPORT_STORAGE_DIRECTORY:reports}"
spring:
  application:
    name: "AgentAzureDevOps"
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agent_azure_devops}"
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD:postgres}"
    driver-class-name: "org.postgresql.Driver"
  ai:
    openai:
      api-key: "${AI_API_KEY:dummy}"
      base-url: "${AI_BASE_URL:http://localhost:4141}"
      chat:
        model: "${AI_MODEL:gpt-5-mini}"
      embedding:
        model: "${AI_EMBEDDING_MODEL:text-embedding-ada-002}"
    vectorstore:
      pgvector:
        table-name: "planning_chunks"
        similarity-threshold: 0.75
logging:
  level:
    co.com.bancolombia: "DEBUG"
    org.springframework.ai: "DEBUG"
    org.springframework.ai.chat: "DEBUG"
management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
azure-devops:
  default-org: "${AZURE_DEVOPS_DEFAULT_ORGANIZATION:grupobancolombia}"
  default-project: "${AZURE_DEVOPS_DEFAULT_PROJECT:Vicepresidencia Servicios de Tecnologí\
    a}"
# Adaptador S3 (módulo s3-repository). El prefijo es EXACTAMENTE el que lee
# S3ConnectionProperties: @ConfigurationProperties(prefix = "adapters.aws.s3"), en plural.
# Fase 08 (D-04): existía un segundo bloque `adapter.aws.s3`, en singular, byte a byte idéntico a
# éste y sin ningún lector. No era una alternativa: era una copia con el prefijo mal escrito, que
# parecía configurar el adaptador sin configurarlo. Se retiró.
adapters:
  aws:
    s3:
      bucketName: "test"
      region: "us-east-1"
      endpoint: "https://s3.localhost.localstack.cloud:4566"
